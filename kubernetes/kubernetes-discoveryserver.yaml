apiVersion: v1
kind: Service
metadata:
  name: spring-cloud-kubernetes-discoveryserver
  labels:
    app: spring-cloud-kubernetes-discoveryserver
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8761
  selector:
    app: spring-cloud-kubernetes-discoveryserver
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spring-cloud-kubernetes-discoveryserver
  labels:
    app: spring-cloud-kubernetes-discoveryserver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spring-cloud-kubernetes-discoveryserver-role
rules:
  - apiGroups: ["", "apps", "endpoints"]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spring-cloud-kubernetes-discoveryserver-binding
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: spring-cloud-kubernetes-discoveryserver-role
subjects:
  - kind: ServiceAccount
    name: spring-cloud-kubernetes-discoveryserver
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-cloud-kubernetes-discoveryserver-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-cloud-kubernetes-discoveryserver
  template:
    metadata:
      labels:
        app: spring-cloud-kubernetes-discoveryserver
    spec:
      serviceAccountName: spring-cloud-kubernetes-discoveryserver
      containers:
        - name: spring-cloud-kubernetes-discoveryserver
          image: springcloud/spring-cloud-kubernetes-discoveryserver:3.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
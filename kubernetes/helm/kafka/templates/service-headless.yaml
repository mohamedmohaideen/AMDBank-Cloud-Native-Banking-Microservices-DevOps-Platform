apiVersion: v1
kind: Service
metadata:
  name: amdbank-kafka-controller-headless
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: controller
      port: 29093
      targetPort: 29093
      protocol: TCP
  selector:
    app.kubernetes.io/name: kafka
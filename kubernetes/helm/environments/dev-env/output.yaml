---
# Source: dev-env/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: amdbankdev-configmap
data:
  SPRING_PROFILES_ACTIVE: default
  SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
  SPRING_CLOUD_KUBERNETES_DISCOVERY_DISCOVERY_SERVER_URL: http://spring-cloud-kubernetes-discoveryserver:80/
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak.default.svc.cluster.local:80/realms/master/protocol/openid-connect/certs
  JAVA_TOOL_OPTIONS: 
  OTEL_EXPORTER_OTLP_ENDPOINT: 
  OTEL_METRICS_EXPORTER: 
  OTEL_LOGS_EXPORTER: 
  SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka-controller-0.kafka-controller-headless.default.svc.cluster.local:9092
---
# Source: dev-env/charts/accounts/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: accounts
spec:
  selector:
    app: accounts
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
---
# Source: dev-env/charts/cards/templates/service.yaml

# Source: dev-env/charts/accounts/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-deployment
  labels:
    app: accounts

spec:
  replicas: 2

  selector:
    matchLabels:
      app: accounts

  template:
    metadata:
      labels:
        app: accounts

    spec:
      containers:
        - name: accounts
          image: "amdbank/accounts:s17"

          ports:
            - containerPort: 8080
              protocol: TCP

          env:
            - name: SPRING_APPLICATION_NAME
              value: accounts
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: amdbankdev-configmap
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_CONFIG_IMPORT
              valueFrom:
                configMapKeyRef:
                  name: amdbankdev-configmap
                  key: SPRING_CONFIG_IMPORT
            - name: SPRING_CLOUD_KUBERNETES_DISCOVERY_DISCOVERY_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: amdbankdev-configmap
                  key: SPRING_CLOUD_KUBERNETES_DISCOVERY_DISCOVERY_SERVER_URL
            - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: amdbankdev-configmap
                  key: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
